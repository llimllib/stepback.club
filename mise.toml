[tools]
node = "24"
duckdb = "latest"
"npm:oxlint" = "latest"
oxfmt = "latest"

[tasks.dev]
description = "Dev server"
run = "npm run dev"

[tasks.build]
description = "Build the static site into dist/"
run = "npm run build"

[tasks.fmt]
description = "Format everything in place"
run = "oxfmt"

[tasks.lint]
description = "Check formatting, lints and types"
run = ["oxfmt --check", "oxlint --deny-warnings", "npx astro check"]

[tasks.install-traffic]
description = "Install or update the /nba traffic report on billmill.org"
run = "ops/traffic/install.sh"
